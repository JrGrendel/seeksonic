services:
  seeksonic:
    image: ghcr.io/jrgrendel/seeksonic:main
    restart: unless-stopped
    environment:
      NAVIDROME_URL: "${NAVIDROME_URL}"
      NAVIDROME_USER: "${NAVIDROME_USER}"
      NAVIDROME_PASSWORD: "${NAVIDROME_PASSWORD}"
      MEILISEARCH_URL: "http://seeksonic-meili:7700"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      ADMIN_SESSION_SECRET: "${ADMIN_SESSION_SECRET}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      SYNC_INTERVAL_MINUTES: "${SYNC_INTERVAL_MINUTES:-30}"
      SYNC_WORKERS: "${SYNC_WORKERS:-4}"
      LYRIC_MATCH_LIMIT: "${LYRIC_MATCH_LIMIT:-5}"
      WAITRESS_THREADS: "${WAITRESS_THREADS:-8}"
      MEILI_TASK_TIMEOUT: "${MEILI_TASK_TIMEOUT:-120}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - proxy_data:/app/data
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8788}:8080"
    depends_on:
      seeksonic-meili:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: 512m
    pids_limit: 100
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  seeksonic-meili:
    image: getmeili/meilisearch:v1.56.2
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "${MEILI_NO_ANALYTICS:-true}"
    volumes:
      - meili_data:/meili_data
    expose:
      - "7700"
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:7700/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  meili_data:
  proxy_data:
